# LOCAL DEVELOPMENT stack. For the VPS, see docker-compose.prod.yml.
#
#   docker compose up          # db + API (tsx watch) + client (vite), hot reload
#   docker compose down        # stop; add -v to also drop the database volume
#
# Postgres publishes 5433, not 5432, so this does not collide with a Homebrew
# Postgres already running on the host.

services:
  db:
    image: postgres:16-alpine
    container_name: hrms-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      # Host-local only, and off 5432 to avoid the brew Postgres.
      - '127.0.0.1:5433:5432'
    volumes:
      - hrms-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms -d hrms']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: node:22-alpine
    container_name: hrms-dev-server
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://hrms:hrms@db:5432/hrms?schema=public
      JWT_SECRET: dev-only-secret-not-for-production
      JWT_EXPIRES_IN: 12h
      UPLOAD_DIR: /app/server/uploads
    ports:
      # 5001, not 5000: macOS AirPlay Receiver (ControlCenter/AirTunes) listens on
      # *:5000 and answers 403 before Docker's 127.0.0.1 bind is reached. The
      # container still listens on 5000 internally, which is what Vite proxies to.
      - '127.0.0.1:5001:5000'
    volumes:
      - .:/app
      # Keep container-built node_modules from being shadowed by the host's,
      # which contain darwin-arm64 binaries that cannot run on linux.
      - hrms-dev-root-modules:/app/node_modules
      - hrms-dev-server-modules:/app/server/node_modules
      - hrms-dev-client-modules:/app/client/node_modules
      # pnpm's store is a SQLite database. Left on the bind mount it defaults to
      # /app/.pnpm-store, and SQLite over Docker Desktop's virtiofs corrupts it
      # ("database disk image is malformed"). A named volume is real ext4.
      - hrms-dev-pnpm-store:/pnpm-store
    # This is the ONLY container that installs dependencies. The client shares
    # these node_modules volumes and waits for this service to become healthy —
    # two concurrent `pnpm install` runs against the same volume corrupt pnpm's
    # store ("database disk image is malformed").
    command: >
      sh -c "corepack enable && corepack prepare pnpm@11.17.0 --activate &&
             sh /app/docker-dev-server.sh"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:5000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot installs the whole workspace from scratch.
      start_period: 300s

  client:
    image: node:22-alpine
    container_name: hrms-dev-client
    working_dir: /app
    restart: unless-stopped
    depends_on:
      # Waits for the server to finish installing into the shared node_modules
      # volumes; this container must not run its own install.
      server:
        condition: service_healthy
    environment:
      # Vite proxies /api to the server container rather than localhost.
      VITE_DEV_API_TARGET: http://server:5000
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - hrms-dev-root-modules:/app/node_modules
      - hrms-dev-server-modules:/app/server/node_modules
      - hrms-dev-client-modules:/app/client/node_modules
    # No `pnpm install` here on purpose — see the note on the server service.
    command: >
      sh -c "corepack enable && corepack prepare pnpm@11.17.0 --activate &&
             pnpm --filter client dev --host 0.0.0.0"

volumes:
  hrms-dev-db-data:
  hrms-dev-root-modules:
  hrms-dev-server-modules:
  hrms-dev-client-modules:
  hrms-dev-pnpm-store:
