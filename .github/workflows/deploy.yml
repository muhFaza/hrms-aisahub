name: CI / Deploy

# Test every push and PR; deploy only when main moves.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

# Never let two deploys touch the VPS at once. Queue rather than cancel: a
# half-finished `docker load` on a 1GB box is worse than waiting.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.17.0'

jobs:
  test:
    name: Lint, build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Apply migrations
        run: pnpm --filter server exec prisma migrate deploy --schema=prisma/schema.prisma

      # The API smoke tests query seeded rows, so seed before running them.
      - name: Seed
        run: pnpm prisma:seed

      # eslint without --fix: CI should report problems, not silently rewrite files.
      - name: Lint
        run: pnpm -r exec eslint .

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to VPS
    needs: test
    # Only on main, and never for pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hr.muhammadfaza.com

    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
          EOF

      # The VPS has 1GB RAM and an OOM history. Refuse rather than take down
      # the other services sharing that box.
      - name: Check VPS has room
        run: |
          ssh vps 'free -m'
          AVAIL=$(ssh vps "free -m | awk '/^Mem:/{print \$7}'")
          echo "available: ${AVAIL}MB"
          if [ "$AVAIL" -lt 150 ]; then
            echo "::error::Only ${AVAIL}MB available on the VPS; need ~150MB."
            exit 1
          fi

      # Runners are x86_64, so this is a native build — no QEMU emulation.
      # Retried because the build pulls ~450 packages from the npm registry and a
      # single slow tarball fails the whole build; the Dockerfile also raises
      # pnpm's fetch timeout for the large Prisma tarballs.
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            echo "::group::build attempt $attempt"
            if docker build --platform linux/amd64 -t hrms-app:deploy .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "build attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::docker build failed after 3 attempts"
          exit 1

      # Keep the outgoing image so a rollback is a retag rather than a rebuild.
      # One of the two instances now holds real payroll; `docker tag
      # hrms-app:previous hrms-app:deploy && docker compose up -d` is the fastest
      # way back. Nothing on a first-ever deploy, hence the `|| true`.
      - name: Tag the outgoing image as :previous
        run: |
          ssh vps 'docker image inspect hrms-app:deploy >/dev/null 2>&1 && docker tag hrms-app:deploy hrms-app:previous || true'

      - name: Ship image to VPS
        run: |
          docker image inspect hrms-app:deploy --format '{{.Size}}' \
            | awk '{printf "shipping ~%.0fMB uncompressed\n", $1/1024/1024}'
          docker save hrms-app:deploy | gzip -1 | ssh vps 'gunzip | docker load'

      # One image, two compose files. Both reference hrms-app:deploy, so the single
      # `docker load` above feeds both instances.
      - name: Sync compose files
        run: |
          ssh vps 'mkdir -p ~/hrms ~/hrms-live'
          scp docker-compose.demo.yml vps:hrms/docker-compose.yml
          scp docker-compose.live.yml vps:hrms-live/docker-compose.yml
          # .env is created once by hand per directory and never overwritten from CI.
          ssh vps 'test -f ~/hrms/.env' || {
            echo "::error::~/hrms/.env missing on the VPS. Create it from .env.docker.example."
            exit 1
          }
          ssh vps 'test -f ~/hrms-live/.env' || {
            echo "::error::~/hrms-live/.env missing on the VPS. Create it from .env.docker.example — and give it a JWT_SECRET different from the demo's."
            exit 1
          }
          # Compared on the server so no secret ever reaches a runner log. auth.ts
          # trusts only the userId in a token and re-reads the role from the
          # database, so a shared secret makes a token minted by the demo's
          # hr@aisahub.com — whose password is printed on the demo login page — a
          # valid token for the same user ID on live. Full auth bypass into payroll.
          ssh vps 'test "$(grep ^JWT_SECRET= ~/hrms/.env)" != "$(grep ^JWT_SECRET= ~/hrms-live/.env)"' || {
            echo "::error::JWT_SECRET must differ between demo and live — a shared secret makes demo tokens valid on live."
            exit 1
          }
          # Fail here, not 150 seconds from now. With BOOTSTRAP_ON_START=true and an
          # empty database, bootstrap.js exits 1 when either variable is missing;
          # `set -e` in the entrypoint then kills the container, restart:
          # unless-stopped brings it straight back, and the only symptom is the
          # health wait timing out much later with a restart loop behind it.
          ssh vps "grep -Eq '^BOOTSTRAP_HR_EMAIL=.+' ~/hrms-live/.env" || {
            echo "::error::~/hrms-live/.env needs a non-empty BOOTSTRAP_HR_EMAIL — without it the first boot cannot create an account to log in with."
            exit 1
          }
          ssh vps "grep -Eq '^BOOTSTRAP_HR_PASSWORD=.+' ~/hrms-live/.env" || {
            echo "::error::~/hrms-live/.env needs a non-empty BOOTSTRAP_HR_PASSWORD — without it the first boot cannot create an account to log in with."
            exit 1
          }

      - name: Start live containers
        run: ssh vps 'cd ~/hrms-live && docker compose up -d'

      # Freeze switch for defence week: set the repository variable DEPLOY_DEMO to
      # 'false' and the demo container keeps running whatever image it already has,
      # with its database and uploads volume untouched. The live instance still
      # deploys. This is a switch, not a branch — no code diverges.
      - name: Start demo containers
        if: vars.DEPLOY_DEMO != 'false'
        run: ssh vps 'cd ~/hrms && docker compose up -d'

      - name: Wait for live healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(ssh vps "docker inspect --format '{{.State.Health.Status}}' hrms-live-app 2>/dev/null || echo missing")
            [ "$STATUS" = "healthy" ] && { echo "healthy"; exit 0; }
            echo "  [$i/30] $STATUS"
            sleep 5
          done
          echo "::error::hrms-live-app did not become healthy"
          ssh vps 'cd ~/hrms-live && docker compose logs --tail 40 hrms-live-app'
          exit 1

      - name: Wait for demo healthy
        if: vars.DEPLOY_DEMO != 'false'
        run: |
          for i in $(seq 1 30); do
            STATUS=$(ssh vps "docker inspect --format '{{.State.Health.Status}}' hrms-app 2>/dev/null || echo missing")
            [ "$STATUS" = "healthy" ] && { echo "healthy"; exit 0; }
            echo "  [$i/30] $STATUS"
            sleep 5
          done
          echo "::error::hrms-app did not become healthy"
          ssh vps 'cd ~/hrms && docker compose logs --tail 40 hrms-app'
          exit 1

      # Longer than the demo's loop: hr.muhammadfaza.com is new, so the first
      # deploy has to wait on Let's Encrypt issuing its certificate.
      - name: Verify live public endpoint
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://hr.muhammadfaza.com/api/v1/health) || CODE=000
            [ "$CODE" = "200" ] && { echo "OK: 200"; exit 0; }
            echo "  [$i/18] -> $CODE"
            sleep 10
          done
          echo "::error::https://hr.muhammadfaza.com/api/v1/health never returned 200"
          exit 1

      - name: Verify demo public endpoint
        if: vars.DEPLOY_DEMO != 'false'
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://hrms.muhammadfaza.com/api/v1/health) || CODE=000
            [ "$CODE" = "200" ] && { echo "OK: 200"; exit 0; }
            echo "  [$i/12] -> $CODE"
            sleep 10
          done
          echo "::error::https://hrms.muhammadfaza.com/api/v1/health never returned 200"
          exit 1

      - name: Report
        if: always()
        run: |
          {
            echo "### Deploy: https://hr.muhammadfaza.com (live) + https://hrms.muhammadfaza.com (demo)"
            echo
            echo '```'
            ssh vps 'free -m; docker stats --no-stream --format "{{.Name}}  {{.MemUsage}}" | grep hrms' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
